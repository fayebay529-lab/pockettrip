name: Pockettrip cloud-save fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cloud ownership
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          old1 = '  payload.owner = trip.owner || currentUser;'
          new1 = '  payload.owner = currentAuthUser?.id || currentUser;'
          old2 = '    owner_id: trip.owner || currentUser,'
          new2 = '    owner_id: currentAuthUser?.id || currentUser,'
          changed = False
          if old1 in s:
              s = s.replace(old1, new1, 1)
              changed = True
          if old2 in s:
              s = s.replace(old2, new2, 1)
              changed = True
          if not changed:
              print('Cloud ownership patch already applied; nothing to change.')
          else:
              path.write_text(s, encoding='utf-8')
              print('Patched authenticated owner ID')

      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "Use authenticated user ID for cloud trip ownership"
            git push
          fi
